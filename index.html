<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priručnik BO 2026</title>
<meta name="description" content="Brza pretraga Priručnika za rad biračkih odbora 2026 – broj strane i tekst iz papirnog priručnika.">
<meta name="theme-color" content="#eaf2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1712" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="traka">
  <div class="unutra">
    <div class="polje">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>
      </svg>
      <input id="upit" type="search" autofocus autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" enterkeyhint="search" inputmode="search"
             placeholder="Ukucaj pitanje" aria-label="Pretraga priručnika">
      <button id="obrisi" class="obrisi" type="button" aria-label="Obriši pitanje" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="alati">
      <button id="recenice" class="recenice-dugme" type="button" aria-expanded="false" aria-controls="rezultati" hidden>💬 Rečenice</button>
      <button id="pismo" type="button" aria-pressed="false">Latinica</button>
      <button id="tema" type="button" aria-label="Promeni temu">Tamna tema</button>
    </div>
  </div>
</header>

<main>
  <p id="status" class="status" aria-live="polite">Učitavam priručnik…</p>
  <section id="rezultati" aria-label="Rezultati iz priručnika"></section>
  <section id="saveti" aria-label="Interni saveti"></section>
</main>

<footer class="podnozje">
  <p>Broj strane je štampani broj u papirnom Priručniku za rad biračkih odbora 2026.</p>
  <p id="offline"></p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
